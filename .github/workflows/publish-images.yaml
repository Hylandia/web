name: publish-web-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-web-images
  cancel-in-progress: true

env:
  REGISTRY: repo.hylandia.net
  REPOSITORY: repo.hylandia.net/docker-hosted/hylandia

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and publish site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          push: true
          build-args: PUBLIC_API_BASE_URL=https://api.hylandia.net
          tags: ${{ env.REPOSITORY }}/web-site:sha-${{ github.sha }}
          cache-from: type=gha,scope=web-site
          cache-to: type=gha,mode=max,scope=web-site
      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: ${{ env.REPOSITORY }}/web-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=web-api
          cache-to: type=gha,mode=max,scope=web-api
