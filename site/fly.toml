# Hylandia marketing site
# Deploy from web/: fly deploy .. -c site/fly.toml --dockerfile site/Dockerfile --build-arg PUBLIC_API_BASE_URL=https://api.hylandia.net

app = "hylandia-site"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ORIGIN = "https://hylandia.net"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/"
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
