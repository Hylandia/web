# Hylandia web API
# Deploy: fly deploy (from this directory)

app = "hylandia-web-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  RUN_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep at least one machine warm: the site treats a failed /auth/me as
  # "API unreachable" and hides the sign-in button entirely, so a cold
  # start here would make auth silently disappear for the first visitor.
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
