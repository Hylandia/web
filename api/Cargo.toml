[workspace]
resolver = "2"

members = [
    "crates/db",
    "apps/api",
]

default-members = [
    "apps/api",
]

[workspace.dependencies]
diesel = { version = "2.2", features = ["postgres", "uuid", "chrono", "network-address"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
bb8 = "0.8"
ipnetwork = "0.21"
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
